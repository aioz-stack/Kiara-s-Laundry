<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Kiara Laundry</title>
    <link rel="stylesheet" href="style.css" />
    <script type="module" src="connect.mjs"></script>
  </head>
  <body>
    <main id="connect" hidden>
      <h1>Connect to your shop</h1>
      <p>
        On the shop computer, open Kiara Laundry and choose Phone access. Type the address it shows.
      </p>
      <form novalidate>
        <label for="address">Shop server address</label>
        <input
          id="address"
          name="address"
          type="text"
          inputmode="url"
          autocomplete="off"
          autocapitalize="none"
          spellcheck="false"
          placeholder="192.168.1.20:47800"
          required
        />
        <p id="problem" role="alert" hidden></p>
        <button type="submit">Connect</button>
      </form>
    </main>
  </body>
</html>
